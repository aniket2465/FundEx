spring.application.name=fundEx

# Render sets PORT automatically; locally it falls back to 8080
server.port=${PORT:8080}

# Optional local-only file (NOT committed to GitHub) for your real local secrets
spring.config.import=optional:file:./local.properties

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fundex_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- JWT (Base64 string, at least 32 bytes) ----------
fundex.jwt.secret=${JWT_SECRET:}

# ---------- CORS: allowed frontend URLs, comma-separated ----------
fundex.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}